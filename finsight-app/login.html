<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Finsight - Login to your account">
    <meta name="author" content="Finsight Team - Person 1">
    <title>Login - Finsight</title>
    
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS Files -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="login-page">

    <!-- ============================================
         SIMPLE NAVBAR - Back to Home
         ============================================ -->
    <nav class="navbar navbar-light bg-white shadow-sm">
        <div class="container">
            <!-- Brand/Logo -->
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-wallet"></i>
                Finsight
            </a>
            
            <!-- Back to Home Link -->
            <a href="index.html" class="btn btn-outline-primary btn-sm">
                <i class="fas fa-arrow-left me-2"></i> Back to Home
            </a>
        </div>
    </nav>

    <!-- ============================================
         AUTHENTICATION SECTION
         ============================================ -->
    <section class="auth-section d-flex align-items-center justify-content-center">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-10 col-lg-8 col-xl-6">
                    
                    <!-- Auth Card -->
                    <div class="card auth-card border-0 shadow-lg">
                        <div class="card-body p-5">
                            
                            <!-- Logo/Icon at Top -->
                            <div class="text-center mb-4">
                                <div class="auth-logo mb-3">
                                    <i class="fas fa-wallet"></i>
                                </div>
                                <h3 class="fw-bold mb-2">Welcome to Finsight</h3>
                                <p class="text-muted">Manage your finances smartly</p>
                            </div>
                            
                            <!-- Bootstrap Nav Tabs -->
                            <ul class="nav nav-tabs nav-fill auth-tabs mb-4" id="authTabs" role="tablist">
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link active" id="login-tab" data-bs-toggle="tab" 
                                            data-bs-target="#login-content" type="button" role="tab" 
                                            aria-controls="login-content" aria-selected="true">
                                        <i class="fas fa-sign-in-alt me-2"></i> Login
                                    </button>
                                </li>
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link" id="signup-tab" data-bs-toggle="tab" 
                                            data-bs-target="#signup-content" type="button" role="tab" 
                                            aria-controls="signup-content" aria-selected="false">
                                        <i class="fas fa-user-plus me-2"></i> Sign Up
                                    </button>
                                </li>
                            </ul>
                            
                            <!-- Tab Content -->
                            <div class="tab-content" id="authTabContent">
                                
                                <!-- ==================== LOGIN TAB ==================== -->
                                <div class="tab-pane fade show active" id="login-content" role="tabpanel" 
                                     aria-labelledby="login-tab">
                                    
                                    <form id="loginForm" class="auth-form">
                                        
                                        <!-- Login form content will be added in next commit -->
                                        <div class="text-center text-muted py-5">
                                            <p>Login form will be built in next commit</p>
                                        </div>
                                        
                                    </form>
                                    
                                </div>
                                
                                <!-- ==================== SIGN UP TAB ==================== -->
                                <div class="tab-pane fade" id="signup-content" role="tabpanel" 
                                     aria-labelledby="signup-tab">
                                    
                                    <form id="signupForm" class="auth-form">
                                        
                                        <!-- Sign up form content will be added in next commit -->
                                        <div class="text-center text-muted py-5">
                                            <p>Sign up form will be built in next commit</p>
                                        </div>
                                        
                                    </form>
                                    
                                </div>
                                
                            </div>
                            
                        </div>
                    </div>
                    
                    <!-- Additional Links Below Card -->
                    <div class="text-center mt-4">
                        <p class="text-white">
                            <a href="#" class="text-white text-decoration-none">Privacy Policy</a>
                            <span class="mx-2">•</span>
                            <a href="#" class="text-white text-decoration-none">Terms of Service</a>
                        </p>
                    </div>
                    
                </div>
            </div>
        </div>
    </section>

    <!-- Bootstrap JS Bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JavaScript (will be added later) -->
    <!-- <script src="js/auth-validation.js"></script> -->

</body>
</html>
